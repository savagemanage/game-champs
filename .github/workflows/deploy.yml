name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; do not cancel an in-progress run so a
# publish that is mid-flight finishes cleanly.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all games
        run: npm run build:games

      # Glob over the workspaces rather than naming them: a new game is picked
      # up by adding packages/<slug>/, with no change to this file.
      - name: Collect game builds
        run: |
          set -euo pipefail
          mkdir -p _site
          shopt -s nullglob
          found=0
          for dist in packages/*/dist; do
            pkg="$(basename "$(dirname "$dist")")"
            case "$pkg" in
              _*) continue ;;   # packages/_template and friends are scaffolding
            esac
            echo "collecting $pkg"
            rm -rf "_site/$pkg"
            cp -r "$dist" "_site/$pkg"
            found=$((found + 1))
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::No packages/*/dist directories were produced" >&2
            exit 1
          fi
          echo "collected $found game build(s)"

      - name: Generate landing page
        run: npm run build:site -- --out _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
