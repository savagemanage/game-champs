<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Games</title>
    <meta
      name="description"
      content="A collection of original browser games built with TypeScript, Vite and Phaser 3."
    />
    <!--
      This file is a TEMPLATE. The deployed landing page is generated by
      site/build.mjs, which reads every packages/*/game.json and replaces the
      <!-* @cards *-> marker below with one card per game. Do not add game links
      here by hand - add a workspace under packages/ with a game.json instead.
    -->
    <style>
      :root {
        color-scheme: dark;
        --bg-card: rgba(255, 255, 255, 0.04);
        --border-card: rgba(255, 255, 255, 0.08);
        --accent: #7896ff;
        --text: #eef2ff;
        --text-dim: #9aa7d4;
        --text-faint: #6b769c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
        background: radial-gradient(circle at 50% 0%, #1b2440 0%, #0b0f1c 60%, #05070d 100%);
        background-attachment: fixed;
        color: var(--text);
        padding: 3.5rem 1.25rem 2.5rem;
      }
      header {
        text-align: center;
        margin-bottom: 2.5rem;
        max-width: 40rem;
      }
      h1 {
        margin: 0 0 0.6rem;
        font-size: clamp(2rem, 5vw, 3rem);
        letter-spacing: 0.02em;
      }
      header p {
        margin: 0;
        color: var(--text-dim);
        font-size: 1rem;
        line-height: 1.6;
      }
      ul.games {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 1rem;
        width: 100%;
        max-width: 68rem;
        grid-template-columns: repeat(auto-fill, minmax(19rem, 1fr));
      }
      a.game {
        display: grid;
        grid-template-columns: 4.5rem 1fr;
        gap: 1rem;
        height: 100%;
        align-items: start;
        text-decoration: none;
        color: inherit;
        background: var(--bg-card);
        border: 1px solid var(--border-card);
        border-radius: 14px;
        padding: 1.1rem 1.25rem;
        transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
      }
      a.game:hover,
      a.game:focus-visible {
        transform: translateY(-2px);
        border-color: rgba(120, 150, 255, 0.6);
        background: rgba(120, 150, 255, 0.1);
        outline: none;
      }
      .thumb {
        width: 4.5rem;
        height: 4.5rem;
        border-radius: 10px;
        object-fit: cover;
        display: grid;
        place-items: center;
        font-size: 1.35rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: rgba(255, 255, 255, 0.92);
        background: linear-gradient(145deg, hsl(var(--hue) 55% 42%), hsl(var(--hue) 60% 22%));
      }
      .body {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
        min-width: 0;
      }
      .title-row {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      .name {
        font-size: 1.1rem;
        font-weight: 600;
        line-height: 1.25;
      }
      .badge {
        font-size: 0.65rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 0.15rem 0.45rem;
        border-radius: 999px;
        background: rgba(255, 190, 90, 0.16);
        border: 1px solid rgba(255, 190, 90, 0.45);
        color: #ffcf8a;
      }
      .name-ko {
        font-size: 0.85rem;
        color: var(--text-dim);
      }
      .genre {
        font-size: 0.7rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .summary {
        margin-top: 0.15rem;
        font-size: 0.85rem;
        line-height: 1.5;
        color: var(--text-dim);
      }
      footer {
        margin-top: 3rem;
        color: var(--text-faint);
        font-size: 0.85rem;
        text-align: center;
        line-height: 1.7;
      }
      footer a {
        color: var(--text-dim);
      }
      @media (prefers-reduced-motion: reduce) {
        a.game {
          transition: none;
        }
        a.game:hover,
        a.game:focus-visible {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Open Games</h1>
      <p>
        A collection of original browser games, built with TypeScript, Vite and Phaser 3. Pick one
        to play - everything runs client-side, no install and no sign-up.
      </p>
    </header>
    <ul class="games">
      <!-- @cards -->
    </ul>
    <footer>
      <p>
        Original works, not affiliated with any game studio. Apache-2.0 licensed.<br />
        Built with Vite &middot; deployed to GitHub Pages.
      </p>
    </footer>
  </body>
</html>
