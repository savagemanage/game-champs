<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Champs</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: radial-gradient(circle at 50% 0%, #1b2440 0%, #0b0f1c 60%, #05070d 100%);
        color: #eef2ff;
        padding: 3rem 1.25rem;
      }
      header {
        text-align: center;
        margin-bottom: 2.5rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(2rem, 5vw, 3rem);
        letter-spacing: 0.02em;
      }
      header p {
        margin: 0;
        color: #9aa7d4;
        font-size: 1rem;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 1rem;
        width: 100%;
        max-width: 560px;
      }
      a.game {
        display: flex;
        align-items: center;
        justify-content: space-between;
        text-decoration: none;
        color: inherit;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 14px;
        padding: 1.1rem 1.4rem;
        transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
      }
      a.game:hover {
        transform: translateY(-2px);
        border-color: rgba(120, 150, 255, 0.6);
        background: rgba(120, 150, 255, 0.1);
      }
      a.game .name {
        font-size: 1.15rem;
        font-weight: 600;
      }
      a.game .arrow {
        color: #7f8fd6;
        font-size: 1.25rem;
      }
      footer {
        margin-top: 2.5rem;
        color: #6b769c;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Game Champs</h1>
      <p>A collection of browser games. Pick one to play.</p>
    </header>
    <ul>
      <li>
        <a class="game" href="/game-champs/champs/">
          <span class="name">Arena Champions</span>
          <span class="arrow" aria-hidden="true">&rarr;</span>
        </a>
      </li>
      <li>
        <a class="game" href="/game-champs/whiteout/">
          <span class="name">Frosthold: Last Ember / 서리성채</span>
          <span class="arrow" aria-hidden="true">&rarr;</span>
        </a>
      </li>
      <li>
        <a class="game" href="/game-champs/lastwar/">
          <span class="name">LAST SQUAD</span>
          <span class="arrow" aria-hidden="true">&rarr;</span>
        </a>
      </li>
      <li>
        <a class="game" href="/game-champs/kingshot/">
          <span class="name">Kingdom Rise</span>
          <span class="arrow" aria-hidden="true">&rarr;</span>
        </a>
      </li>
      <li>
        <a class="game" href="/game-champs/wirework/">
          <span class="name">Wirework</span>
          <span class="arrow" aria-hidden="true">&rarr;</span>
        </a>
      </li>
    </ul>
    <footer>Built with Vite &middot; Deployed to GitHub Pages</footer>
  </body>
</html>
