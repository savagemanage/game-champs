<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>서리성채</title>
    <!--
      Original ember-in-the-cold favicon (public/favicon.png, generated by
      tools/gen_sprites.py). A RELATIVE href ("./favicon.png") is base-path-safe:
      it resolves under the project-pages base (/game-whiteout/favicon.png) in
      production and under "/" in dev, never at the site root.
    -->
    <link rel="icon" type="image/png" href="./favicon.png" />
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0c121c;
        overflow: hidden;
      }
      #game {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game canvas {
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
