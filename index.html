<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>라스트 스쿼드 · LAST SQUAD</title>
    <!--
      Inline SVG favicon (data URI) so a static, subpath-hosted deploy never
      requests /favicon.ico (which 404s on GitHub Pages). Original amber "L"
      target mark on the dark HUD background.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2311151c'/%3E%3Crect x='3' y='3' width='2' height='9' fill='%23ffb020'/%3E%3Crect x='5' y='10' width='6' height='2' fill='%23ffb020'/%3E%3C/svg%3E"
    />
    <!--
      Self-hosted Hangul-capable pixel monospace webfont (Galmuri Mono 9, SIL
      OFL-1.1). Bundled under public/assets/fonts so it ships with the build and
      resolves under the Vite base path (/game-lastwar/) with no external CDN /
      network at runtime. The @font-face family name (GalmuriMono9) must match
      UI_FONT_FAMILY in src/ui/UiText.ts. Text rendering is gated on
      document.fonts in main.ts so Phaser rasterizes glyphs with this font.
    -->
    <style>
      @font-face {
        font-family: 'GalmuriMono9';
        font-style: normal;
        font-weight: 400;
        font-display: block;
        /*
          Relative URL (no leading slash) so it resolves against the document
          URL, which is served under the Vite base ('/' in dev,
          '/game-lastwar/' in production). The file lives in public/assets/fonts
          and Vite copies public/ to the base root at build time.
        */
        src: url('assets/fonts/GalmuriMono9.woff2') format('woff2');
      }
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #11151c;
        overflow: hidden;
      }
      #game {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game canvas {
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
