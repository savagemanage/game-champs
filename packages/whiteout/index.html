<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>서리성채</title>
    <!--
      Original ember-in-the-cold favicon (public/favicon.png, generated by
      tools/gen_sprites.py). A RELATIVE href ("./favicon.png") is base-path-safe:
      it resolves under the project-pages base (/game-whiteout/favicon.png) in
      production and under "/" in dev, never at the site root.
    -->
    <link rel="icon" type="image/png" href="./favicon.png" />
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0c121c;
        overflow: hidden;
      }
      #game {
        box-sizing: border-box;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /*
        The canvas backbuffer is rendered at the device's real pixel resolution
        (logical 960x540 * devicePixelRatio - see src/main.ts / ui/renderScale.ts)
        and Scale.FIT letterboxes it to the viewport, so there is NO low-res
        buffer for the browser to nearest-neighbour-upscale. We therefore do NOT
        force `image-rendering: pixelated` on the whole canvas: that would make
        UI/HUD text jagged, and it is unnecessary for sprites because pixel-art
        crispness comes from Phaser's per-texture NEAREST filtering (pixelArt:true),
        not from a canvas-wide CSS upscale. Any residual FIT letterbox scaling is
        left smooth so glyph edges stay clean.
      */
      #game canvas {
        image-rendering: auto;
      }
      .sr-only,
      .canvas-a11y-button {
        position: fixed;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .canvas-a11y-button:focus-visible {
        clip: auto;
        width: auto;
        height: 44px;
        margin: 0;
        padding: 8px 16px;
        top: max(8px, env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
        color: #eef4fb;
        background: #18202e;
        border: 3px solid #ff7a3c;
        border-radius: 4px;
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
